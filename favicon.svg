<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A1A4F"/>
      <stop offset="50%" stop-color="#4C2365"/>
      <stop offset="100%" stop-color="#622B7E"/>
    </linearGradient>
    <linearGradient id="toothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3E8FF"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4A4DA"/>
      <stop offset="100%" stop-color="#E9D5FF"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1A0726" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Squircle / Rounded Container -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="118" height="118" rx="27" fill="none" stroke="#A77DC2" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Clinical Tooth Emblem with Precision Aesthetics -->
  <g filter="url(#softShadow)" transform="translate(18, 16)">
    <!-- Main Tooth Silhouette -->
    <path
      d="M16 26 C15 13 22 4 33 4 C38 4 41 8 42 8 C43 8 46 4 51 4 C62 4 69 13 68 26 C66.5 40 59 52 56 68 C54.5 76 48 76 45 68 C42 59 40 50 37 50 C34 50 32 59 29 68 C26 76 19.5 76 18 68 C15 52 17.5 40 16 26 Z"
      fill="url(#toothGrad)"
    />

    <!-- Internal Aesthetic Occlusal Contour (Enamel Smile Curve) -->
    <path
      d="M27 24 C33 28 51 28 57 24"
      fill="none"
      stroke="#7F5D99"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.9"
    />

    <!-- Central Precision Axis / Root Separation -->
    <path
      d="M42 27 L42 40"
      fill="none"
      stroke="#7F5D99"
      stroke-width="2.5"
      stroke-linecap="round"
      opacity="0.85"
    />

    <!-- Digital Innovation Sparkle (Top-Right Aesthetic Star) -->
    <g transform="translate(63, 6)">
      <path
        d="M6 0 L7.4 4.6 L12 6 L7.4 7.4 L6 12 L4.6 7.4 L0 6 L4.6 4.6 Z"
        fill="url(#accentGrad)"
      />
    </g>
  </g>
</svg>